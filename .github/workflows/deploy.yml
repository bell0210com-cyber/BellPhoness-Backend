name: Deploy Backend to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Inject environment variables and deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # ── Inject all required environment variables into the VPS .env ──
            # Writes to both /var/www/bellphones/.env and /var/www/bellphones/backend/.env
            set_env() {
              local KEY="$1"
              local VALUE="$2"
              [ -z "$VALUE" ] && return 0
              for TARGET in "/var/www/bellphones/.env" "/var/www/bellphones/backend/.env"; do
                if [ -d "$(dirname "$TARGET")" ]; then
                  touch "$TARGET"
                  node -e '
                    const fs = require("fs");
                    const file = process.argv[1];
                    const key = process.argv[2];
                    const val = process.argv[3];
                    let content = fs.existsSync(file) ? fs.readFileSync(file, "utf8") : "";
                    const regex = new RegExp("^" + key + "=.*$", "m");
                    const newLine = key + "=\"" + val.replace(/"/g, "\\\"") + "\"";
                    if (regex.test(content)) {
                      content = content.replace(regex, newLine);
                    } else {
                      content = (content.endsWith("\n") || content === "" ? content : content + "\n") + newLine + "\n";
                    }
                    fs.writeFileSync(file, content, "utf8");
                  ' "$TARGET" "$KEY" "$VALUE"
                fi
              done
            }

            # Tabby Payment Gateway
            set_env TABBY_ENV            "${{ secrets.TABBY_ENV }}"
            set_env TABBY_API_URL        "${{ secrets.TABBY_API_URL }}"
            set_env TABBY_SECRET_KEY     "${{ secrets.TABBY_SECRET_KEY }}"
            set_env TABBY_PUBLIC_KEY     "pk_test_b8e21976-59a6-4b82-9ae4-0b7305988e0b"
            set_env TABBY_MERCHANT_CODE  "${{ secrets.TABBY_MERCHANT_CODE }}"
            set_env TABBY_WEBHOOK_SECRET "${{ secrets.TABBY_WEBHOOK_SECRET }}"

            # Clean up any old wrong key UUID across all .env files
            for TARGET in "/var/www/bellphones/.env" "/var/www/bellphones/backend/.env"; do
              if [ -f "$TARGET" ]; then
                sed -i 's/pk_test_01a03e76-a3d2-02e4-385f-b38bd6ca4d3a/pk_test_b8e21976-59a6-4b82-9ae4-0b7305988e0b/g' "$TARGET"
              fi
            done

            # Tamara Payment Gateway
            set_env TAMARA_ENV                "${{ secrets.TAMARA_ENV }}"
            set_env TAMARA_API_URL            "${{ secrets.TAMARA_API_URL }}"
            set_env TAMARA_API_TOKEN          "${{ secrets.TAMARA_API_TOKEN }}"
            set_env TAMARA_NOTIFICATION_TOKEN "${{ secrets.TAMARA_NOTIFICATION_TOKEN }}"
            set_env TAMARA_PUBLIC_KEY         "${{ secrets.TAMARA_PUBLIC_KEY }}"

            # Run the existing deploy script (git pull, npm ci, pm2 restart, etc.)
            if [ -f "/var/www/bellphones/deploy-backend.sh" ]; then
              /var/www/bellphones/deploy-backend.sh
            fi
            pm2 restart all || true
